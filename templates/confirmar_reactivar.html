{% extends "base.html" %}

{% block volver %}
    <a href="{{ url_for('ver_cliente', cliente_id=cliente['id']) }}" class="btn-volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver
    </a>
{% endblock %}

{% block content %}
    <h1>Reactivar a {{ cliente['nombre'] }} {{ cliente['apellido'] }}</h1>
    <p>Este cliente está actualmente inactivo. ¿Confirmás que querés reactivarlo? Va a volver a aparecer en las búsquedas.</p>

    <form method="POST" class="formulario">
        <label for="clave">Contraseña:</label>
        <input type="password" id="clave" name="clave" required><br>

        <button type="submit" class="btn btn-primary">Confirmar reactivación</button>
    </form>

{% endblock %}
